[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memcore"
version = "0.1.0+chatv6.2"
description = "Domain-agnostic layered memory core with unified timelines, layered compaction, and deterministic hybrid retrieval."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["memory", "llm", "retrieval", "rag", "embeddings", "long-term-memory", "agents"]
license = "AGPL-3.0-only OR LicenseRef-Commercial"
license-files = ["LICENSE"]
# 双许可证:开源侧 AGPL-3.0-only,闭源/SaaS 商用需单独商业授权
# (见 LICENSE / COMMERCIAL.md / README「授权」)。
# tzdata: time anchoring resolves IANA timezones via zoneinfo; Windows lacks a system tz db.
# Heavy backends (chroma / sentence-transformers) stay optional extras.
dependencies = ["tzdata"]

[project.optional-dependencies]
chroma = ["chromadb>=0.4"]
huggingface = ["sentence-transformers>=2.2"]
speed = ["numpy>=1.24"]
dev = ["pytest>=7", "ruff>=0.15", "build>=1.2"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.setuptools.packages.find]
where = ["."]
include = ["memcore*"]

[tool.setuptools.package-data]
memcore = ["py.typed"]
